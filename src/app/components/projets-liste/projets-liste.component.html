<h2>{{ translationContentService.getContent$("projets-titre") | async }}</h2>
@if (selectedProject) {
  <app-projet-detail [project]="selectedProject" ></app-projet-detail>
}
<div class="filters">
  <div class="arrows">
    <button class="arrow-button" (click)="decrementCursorValue()">&#8592;</button>
    <button class="arrow-button" (click)="incrementCursorValue()">&#8594;</button>
  </div>
  <div class="project-list" #scrollContainer>
    @for (project of cursorProjects; track $index) {
    <app-projet
      [project]="project"
      (click)="clickOnProject(project)"
    ></app-projet>
    } @if(cursorProjects.length === 0){
    <h3>Aucun projet ne correspond à votre recherche</h3>
    }
  </div>
</div>
